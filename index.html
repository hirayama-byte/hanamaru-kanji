<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap">

<style>
/* ============================================================
   はなまるかんじ
   単一テーマ（ふんわりパステルの世界）を意図的に採用。
   ダーク環境でも同じ世界観を保つため、色は全てトークンで明示。
   ============================================================ */
:root{
  color-scheme: light;

  --milk:      #FFF7FB;
  --milk-deep: #FFEDF5;
  --card:      #FFFFFF;

  --pink:      #FF9EC4;
  --pink-deep: #E8619A;
  --pink-soft: #FFDCEB;

  --mint:      #7FD9C0;
  --mint-deep: #3FAE93;
  --mint-soft: #DAF6EE;

  --yellow:      #FFD66B;
  --yellow-deep: #E0A82E;
  --yellow-soft: #FFF3D4;

  --lav:      #B79BEF;
  --lav-deep: #8360D6;
  --lav-soft: #EEE6FF;

  /* ニュートラルはピンク寄りに振ったすもも色。純グレーは使わない */
  --ink:       #6A4658;
  --ink-soft:  #9C7B8B;
  --line:      #F3DCE7;

  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;

  --f-display: 'Yusei Magic', 'Zen Maru Gothic', system-ui, sans-serif;
  --f-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --f-kanji: 'Klee One', 'Zen Maru Gothic', serif;
}
:root[data-theme="dark"]{ color-scheme: light; }

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--milk);
  background-image:
    radial-gradient(120% 80% at 10% 0%,  var(--pink-soft) 0%, transparent 55%),
    radial-gradient(110% 70% at 95% 8%,  var(--mint-soft) 0%, transparent 50%),
    radial-gradient(120% 90% at 50% 105%, var(--yellow-soft) 0%, transparent 55%);
  background-attachment: fixed;
  font-family: var(--f-body);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* ---------- きらきら背景 ---------- */
#sparkles{
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.sp{
  position: absolute;
  font-size: 18px;
  opacity: 0;
  animation: twinkle 5s ease-in-out infinite;
  will-change: transform, opacity;
}
@keyframes twinkle{
  0%   { opacity: 0;   transform: translateY(6px) scale(.5) rotate(0deg); }
  35%  { opacity: .85; transform: translateY(-4px) scale(1) rotate(12deg); }
  70%  { opacity: .35; transform: translateY(-14px) scale(.9) rotate(-8deg); }
  100% { opacity: 0;   transform: translateY(-24px) scale(.5) rotate(0deg); }
}

/* ---------- 画面のわく ---------- */
.stage{
  position: relative; z-index: 1;
  width: 100%; max-width: 500px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(40px, calc(env(safe-area-inset-bottom) + 24px)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 18px;
}
/* 小さめの端末（iPhone SE など）向けの微調整 */
@media (max-width: 380px){
  .stage{ gap: 14px; }
  .card{ padding: 16px 14px; }
  .btn{ padding: 15px 16px; font-size: 1rem; }
  .choice{ padding: 16px 6px 18px; }
}

@media (min-width: 800px){
  .stage{
    margin: 24px auto;
    min-height: auto;
    background: rgba(255,255,255,.55);
    border: 3px solid var(--card);
    border-radius: 40px;
    box-shadow: 0 24px 60px rgba(232,97,154,.16);
    padding: 24px 20px 36px;
  }
}

.screen{ display: none; flex-direction: column; gap: 18px; }
.screen.on{ display: flex; animation: popin .38s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes popin{
  from{ opacity: 0; transform: translateY(14px) scale(.96); }
  to  { opacity: 1; transform: none; }
}

/* ---------- ロゴ ---------- */
.logo{ text-align: center; padding-top: 8px; }
.logo h1{
  font-family: var(--f-display);
  font-size: clamp(2.1rem, 11vw, 2.9rem);
  margin: 0;
  line-height: 1.15;
  text-wrap: balance;
  color: var(--pink-deep);
  text-shadow:
     3px 3px 0 var(--card),
    -2px -2px 0 var(--card),
     0 7px 0 var(--pink-soft);
  letter-spacing: .02em;
}
.logo .sub{
  margin: 12px 0 0;
  font-size: .82rem;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: .12em;
}
.logo .grade-badge{
  display: inline-block;
  margin-top: 12px;
  background: var(--mint);
  color: #fff;
  font-weight: 900;
  font-size: .78rem;
  padding: 7px 16px;
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--mint-deep);
  letter-spacing: .06em;
}

/* ---------- カード ---------- */
.card{
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 20px 18px;
  box-shadow: 0 8px 0 var(--line), 0 16px 30px rgba(232,97,154,.12);
}
.card-title{
  margin: 0 0 14px;
  font-size: .95rem;
  font-weight: 900;
  color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.card-title .dot{
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--pink); flex: none;
  box-shadow: 0 0 0 4px var(--pink-soft);
}

/* ---------- ぷっくりボタン ---------- */
.btn{
  font-family: var(--f-body);
  font-weight: 900;
  border: none;
  border-radius: var(--r-md);
  padding: 17px 20px;
  font-size: 1.05rem;
  color: #fff;
  background: var(--pink);
  box-shadow: 0 6px 0 var(--pink-deep), 0 12px 20px rgba(232,97,154,.28);
  cursor: pointer;
  transition: transform .12s cubic-bezier(.2,1.6,.4,1), box-shadow .12s ease, filter .12s ease;
  width: 100%;
  letter-spacing: .04em;
}
.btn:hover{ transform: translateY(-3px) scale(1.02); filter: brightness(1.04); }
.btn:active{ transform: translateY(4px) scale(.98); box-shadow: 0 2px 0 var(--pink-deep); }
.btn:focus-visible{ outline: 4px solid var(--lav); outline-offset: 3px; }
.btn.mint{ background: var(--mint); box-shadow: 0 6px 0 var(--mint-deep), 0 12px 20px rgba(63,174,147,.26); }
.btn.mint:active{ box-shadow: 0 2px 0 var(--mint-deep); }
.btn.lav{ background: var(--lav); box-shadow: 0 6px 0 var(--lav-deep), 0 12px 20px rgba(131,96,214,.24); }
.btn.lav:active{ box-shadow: 0 2px 0 var(--lav-deep); }
.btn.ghost{
  background: var(--card); color: var(--ink-soft);
  box-shadow: 0 5px 0 var(--line); font-size: .92rem; padding: 14px;
}
.btn.ghost:active{ box-shadow: 0 2px 0 var(--line); }
.btn-row{ display: flex; gap: 10px; }
.btn-row .btn{ flex: 1; }

/* ---------- スタンプカード ---------- */
.stamps{
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.slot{
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px dashed var(--line);
  display: grid; place-items: center;
  background: var(--milk);
  position: relative;
}
.slot svg{ width: 78%; height: 78%; }
.slot.filled{ border: 3px solid transparent; background: var(--pink-soft); }
.slot.pressed{ animation: stamp-press .6s cubic-bezier(.2,1.7,.4,1) both; }
@keyframes stamp-press{
  0%  { transform: scale(2.6) rotate(-22deg); opacity: 0; }
  55% { transform: scale(.86) rotate(6deg);  opacity: 1; }
  100%{ transform: none; opacity: 1; }
}
.stamp-note{
  margin: 12px 0 0; font-size: .78rem; color: var(--ink-soft);
  font-weight: 700; text-align: center;
}
.stamp-note b{ color: var(--pink-deep); font-size: 1rem; }

/* ---------- クイズ ---------- */
.quiz-top{ display: flex; align-items: center; gap: 12px; }
.q-count{
  font-family: var(--f-display);
  font-size: 1.05rem; color: var(--pink-deep); flex: none;
  font-variant-numeric: tabular-nums;
}
.bar{
  flex: 1; height: 14px; border-radius: 999px;
  background: var(--card); box-shadow: inset 0 2px 4px rgba(232,97,154,.14);
  overflow: hidden;
}
.bar > i{
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--yellow), var(--pink));
  border-radius: 999px;
  transition: width .45s cubic-bezier(.3,1.4,.4,1);
}
.hearts{ flex: none; font-size: .95rem; letter-spacing: 1px; }

.q-card{
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 26px 20px 28px;
  box-shadow: 0 8px 0 var(--line), 0 18px 34px rgba(232,97,154,.13);
  text-align: center;
}
.q-label{
  display: inline-block; background: var(--yellow-soft); color: var(--yellow-deep);
  font-size: .72rem; font-weight: 900; padding: 5px 14px; border-radius: 999px;
  letter-spacing: .1em; margin-bottom: 18px;
}
.q-sentence{
  font-size: clamp(1.25rem, 5.6vw, 1.6rem);
  font-weight: 700; line-height: 2.7; margin: 0;
  text-wrap: balance;
}
.q-sentence ruby rt{ font-size: .45em; font-weight: 500; color: var(--ink-soft); }

.q-sentence ruby{ ruby-position: over; }
.q-sentence.no-furigana rt{ visibility: hidden; }
.pr-ex ruby rt{ font-size: .5em; font-weight: 500; color: var(--ink-soft); }

/* ふりがなの表示切り替え */
.ruby-toggle{
  align-self: center;
  font-family: var(--f-body); font-weight: 900; font-size: .76rem;
  color: var(--mint-deep); background: var(--mint-soft);
  border: none; border-radius: 999px; padding: 8px 18px;
  box-shadow: 0 3px 0 rgba(63,174,147,.28);
  cursor: pointer; letter-spacing: .06em;
  transition: transform .12s cubic-bezier(.2,1.6,.4,1);
}
.ruby-toggle:hover{ transform: translateY(-2px); }
.ruby-toggle:active{ transform: translateY(2px); box-shadow: 0 1px 0 rgba(63,174,147,.28); }
.ruby-toggle:focus-visible{ outline: 3px solid var(--lav); outline-offset: 3px; }
.ruby-toggle.off{ color: var(--ink-soft); background: var(--line); box-shadow: 0 3px 0 rgba(232,97,154,.18); }

.blank{
  display: inline-grid; place-items: center;
  width: 2.1em; height: 2.1em;
  vertical-align: -.62em;
  margin: 0 .12em;
  border-radius: 16px;
  background: var(--pink-soft);
  border: 3px dashed var(--pink);
  font-family: var(--f-kanji); font-weight: 600;
  color: var(--pink-deep);
  position: relative;
  animation: blank-pulse 1.6s ease-in-out infinite;
}
@keyframes blank-pulse{
  0%,100%{ transform: scale(1); }
  50%    { transform: scale(1.06); }
}
.blank .yomi{
  position: absolute; top: -1.05em; left: 50%; transform: translateX(-50%);
  font-family: var(--f-body); font-weight: 900;
  font-size: .44em; white-space: nowrap; color: var(--mint-deep);
  background: var(--mint-soft); padding: 3px 11px; border-radius: 999px;
  box-shadow: 0 2px 0 rgba(63,174,147,.18);
}
.blank.done{
  background: var(--mint-soft); border: 3px solid var(--mint); color: var(--mint-deep);
  animation: none;
}
.blank.miss{
  background: var(--lav-soft); border: 3px solid var(--lav); color: var(--lav-deep);
  animation: none;
}

.choices{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice{
  font-family: var(--f-kanji);
  font-weight: 600;
  font-size: clamp(2.4rem, 13vw, 3.2rem);
  line-height: 1;
  padding: 20px 8px 22px;
  border: none;
  border-radius: var(--r-md);
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 6px 0 var(--line), 0 12px 20px rgba(232,97,154,.10);
  cursor: pointer;
  transition: transform .14s cubic-bezier(.2,1.7,.4,1), box-shadow .14s ease, background .2s ease;
}
.choice:hover:not(:disabled){ transform: translateY(-4px) scale(1.03); background: var(--yellow-soft); }
.choice:active:not(:disabled){ transform: translateY(3px) scale(.97); box-shadow: 0 2px 0 var(--line); }
.choice:focus-visible{ outline: 4px solid var(--lav); outline-offset: 3px; }
.choice:disabled{ cursor: default; }
.choice.correct{
  background: var(--mint); color: #fff;
  box-shadow: 0 6px 0 var(--mint-deep);
  animation: bounce-yes .55s cubic-bezier(.2,1.7,.4,1) both;
}
@keyframes bounce-yes{
  0%{ transform: scale(1); } 40%{ transform: scale(1.16) rotate(-4deg); } 100%{ transform: scale(1.05); }
}
.choice.wrong{
  background: var(--lav-soft); color: var(--lav-deep);
  box-shadow: 0 6px 0 var(--lav);
  animation: shake .42s ease both;
}
@keyframes shake{
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-8px) rotate(-3deg); }
  45%{ transform: translateX(7px) rotate(3deg); }
  70%{ transform: translateX(-4px); }
}
.choice.dim{ opacity: .42; }

/* ---------- 正解・不正解のふきだし ---------- */
.judge{
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  pointer-events: none;
}
.judge .bubble{
  font-family: var(--f-display);
  font-size: clamp(2.4rem, 14vw, 3.6rem);
  padding: 26px 40px;
  border-radius: 40px;
  background: var(--card);
  box-shadow: 0 14px 0 var(--line), 0 26px 50px rgba(232,97,154,.28);
  animation: judge-pop .8s cubic-bezier(.2,1.6,.4,1) both;
}
.judge.yes .bubble{ color: var(--mint-deep); }
.judge.no  .bubble{ color: var(--lav-deep); }
@keyframes judge-pop{
  0%  { transform: scale(.3) rotate(-14deg); opacity: 0; }
  35% { transform: scale(1.12) rotate(4deg); opacity: 1; }
  60% { transform: scale(1) rotate(0); opacity: 1; }
  100%{ transform: scale(1.02); opacity: 0; }
}

/* ---------- けっか（はなまる） ---------- */
.result-hero{ text-align: center; padding: 8px 0 4px; position: relative; }
.hanamaru{
  width: min(230px, 62vw); height: min(230px, 62vw);
  margin: 0 auto; display: block;
  animation: maru-draw .9s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes maru-draw{
  0%  { transform: scale(.2) rotate(-90deg); opacity: 0; }
  60% { transform: scale(1.12) rotate(8deg); opacity: 1; }
  100%{ transform: scale(1) rotate(0deg); opacity: 1; }
}
.score{
  font-family: var(--f-display);
  font-size: 1.5rem; color: var(--pink-deep); margin: 6px 0 0;
}
.score b{ font-size: 2.6rem; }
.score-msg{ margin: 6px 0 0; font-weight: 700; color: var(--ink-soft); font-size: .92rem; }

/* ---------- 紙ふぶき ---------- */
#confetti{ position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.cf{
  position: absolute; top: -24px;
  width: 11px; height: 16px;
  opacity: 0;
  animation: fall linear forwards;
  will-change: transform;
}
@keyframes fall{
  0%  { opacity: 1; transform: translateY(-10vh) rotate(0deg); }
  100%{ opacity: .9; transform: translateY(112vh) rotate(760deg); }
}

/* ---------- かんじの いちらん（おすと おおきくなる） ---------- */
.rv-hint{
  margin: -6px 0 12px; font-size: .74rem; font-weight: 700;
  color: var(--ink-soft); letter-spacing: .04em;
}
.kchips{ display: flex; flex-wrap: wrap; gap: 12px; }
.kchip{
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: none; border: none; padding: 0; cursor: pointer;
  font-family: var(--f-body);
  transition: transform .14s cubic-bezier(.2,1.7,.4,1);
}
.kchip:hover{ transform: translateY(-3px) scale(1.05); }
.kchip:active{ transform: translateY(2px) scale(.96); }
.kchip:focus-visible{ outline: 3px solid var(--lav); outline-offset: 4px; border-radius: 18px; }
.kchip-face{
  width: 58px; height: 58px; border-radius: 16px;
  display: grid; place-items: center;
  font-family: var(--f-kanji); font-weight: 600; font-size: 2rem;
  box-shadow: 0 4px 0 rgba(232,97,154,.14);
}
.kchip.weak .kchip-face{ background: var(--lav-soft); color: var(--lav-deep); }
.kchip.done .kchip-face{ background: var(--mint-soft); color: var(--mint-deep); }
.kchip-sub{ font-size: .68rem; font-weight: 900; color: var(--ink-soft); }

/* ---------- 拡大パネル ---------- */
.zoom{
  position: fixed; inset: 0; z-index: 60;
  display: none; place-items: center;
  padding: 18px;
  background: rgba(255, 242, 248, .88);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.zoom.on{ display: grid; animation: popin .3s cubic-bezier(.2,1.5,.4,1) both; }
.zoom-card{
  position: relative;
  width: min(430px, 100%);
  max-height: 92dvh; overflow-y: auto;
  background: var(--card);
  border-radius: 34px;
  padding: 26px 18px 20px;
  text-align: center;
  box-shadow: 0 12px 0 var(--line), 0 30px 60px rgba(232,97,154,.24);
}
.zoom-close{
  position: absolute; top: 12px; right: 12px;
  width: 40px; height: 40px; border-radius: 50%;
  border: none; cursor: pointer;
  background: var(--milk-deep); color: var(--pink-deep);
  font-size: 1.1rem; font-weight: 900; line-height: 1;
  box-shadow: 0 3px 0 var(--line);
}
.zoom-close:active{ transform: translateY(2px); box-shadow: none; }
.zoom-close:focus-visible{ outline: 3px solid var(--lav); outline-offset: 3px; }
.masu.big{ width: min(300px, 68vw); margin-bottom: 14px; }
.masu.big span{ font-size: min(230px, 52vw); }
.masu.done{ border-color: var(--mint); box-shadow: 0 6px 0 var(--mint-soft); }
.masu.done::before{ background-image: repeating-linear-gradient(90deg, var(--mint) 0 10px, transparent 10px 20px); }
.masu.done::after{ background-image: repeating-linear-gradient(180deg, var(--mint) 0 10px, transparent 10px 20px); }
.masu.done span{ color: var(--mint); }
.zoom-meta .pr-ex b{ color: var(--pink-deep); }
.masu.done ~ .zoom-meta .pr-ex b{ color: var(--mint-deep); }
.pr-yomi.done{ background: var(--yellow-soft); color: var(--yellow-deep); }
.zoom-state{
  margin: 10px 0 0; font-size: .76rem; font-weight: 900; color: var(--ink-soft);
}
.zoom-nav{
  display: flex; align-items: center; gap: 10px; margin-top: 16px;
}
.zoom-nav .btn{ flex: 1; }
.zoom-count{
  font-family: var(--f-display); font-size: .9rem; color: var(--pink-deep);
  font-variant-numeric: tabular-nums; flex: none; min-width: 56px;
}

/* ---------- 手書き復習 ---------- */
.practice-lead{
  text-align: center; font-weight: 900; font-size: 1.05rem;
  margin: 0 0 4px; color: var(--pink-deep);
}
.practice-sub{
  text-align: center; font-size: .8rem; color: var(--ink-soft);
  font-weight: 700; margin: 0 0 16px;
}
.pr-item{ margin-bottom: 22px; }
.pr-item:last-child{ margin-bottom: 0; }
.masu{
  position: relative;
  width: min(240px, 66vw); aspect-ratio: 1;
  margin: 0 auto 10px;
  border: 4px solid var(--pink);
  border-radius: 12px;
  background: var(--card);
  display: grid; place-items: center;
  box-shadow: 0 6px 0 var(--pink-soft);
}
/* 十字のマス目 */
.masu::before, .masu::after{
  content: ""; position: absolute; background: var(--pink-soft);
}
.masu::before{ left: 0; right: 0; top: 50%; height: 3px; transform: translateY(-50%);
  background-image: repeating-linear-gradient(90deg, var(--pink) 0 10px, transparent 10px 20px);
  background-color: transparent; }
.masu::after{ top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%);
  background-image: repeating-linear-gradient(180deg, var(--pink) 0 10px, transparent 10px 20px);
  background-color: transparent; }
.masu span{
  font-family: var(--f-kanji); font-weight: 600;
  font-size: min(180px, 50vw); line-height: 1;
  color: var(--pink);
  position: relative; z-index: 1;
}
.pr-meta{ text-align: center; }
.pr-yomi{
  display: inline-block; background: var(--mint-soft); color: var(--mint-deep);
  font-weight: 900; font-size: .82rem; padding: 5px 14px; border-radius: 999px;
}
.pr-ex{ margin: 8px 0 0; font-size: .88rem; font-weight: 700; color: var(--ink-soft); }

/* ---------- ごほうびカード ---------- */
.gallery{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gcard{
  aspect-ratio: 3/4;
  border-radius: var(--r-md);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 6px; padding: 10px;
  box-shadow: 0 6px 0 var(--line), 0 12px 22px rgba(232,97,154,.10);
  background: var(--card);
  overflow: hidden;
  position: relative;
}
.gcard svg{ width: 68%; height: auto; }
.gcard .gname{ font-size: .78rem; font-weight: 900; color: var(--ink); text-align: center; }
.gcard.locked{ background: var(--milk-deep); }
.gcard.locked .gname{ color: var(--ink-soft); }
.gcard.locked .lock svg{ width: 46px; height: 46px; }
.gcard.fresh{ animation: card-reveal .8s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes card-reveal{
  0%  { transform: scale(.4) rotate(-16deg); opacity: 0; }
  60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
  100%{ transform: none; opacity: 1; }
}
.gcard .ribbon{
  position: absolute; top: 8px; left: 8px;
  background: var(--yellow); color: #fff; font-weight: 900; font-size: .6rem;
  padding: 4px 10px; border-radius: 999px; letter-spacing: .1em;
  box-shadow: 0 2px 0 var(--yellow-deep);
}

/* ---------- ごほうび解放のおしらせ ---------- */
.unlock{
  background: linear-gradient(140deg, var(--yellow-soft), var(--pink-soft));
  border: 3px dashed var(--yellow);
  border-radius: var(--r-lg);
  padding: 18px; text-align: center;
}
.unlock h3{
  font-family: var(--f-display); margin: 0 0 10px;
  font-size: 1.15rem; color: var(--yellow-deep);
}
.unlock svg{ width: 96px; height: 96px; }
.unlock .uname{ font-weight: 900; margin-top: 6px; }

.foot{
  text-align: center; font-size: .7rem; color: var(--ink-soft);
  font-weight: 700; letter-spacing: .06em; padding-bottom: 4px;
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
  .sp{ opacity: .5; }
}

function statOf(k){
  if(!DB.stats[k]) DB.stats[k] = { streak:0, wrong:0, seen:0, mastered:false, lastWrong:0 };
  return DB.stats[k];
}

/* ============================================================
   3. しゅつだい アルゴリズム
      ゆうせん① まちがえた かんじ（まちがえた かいすう が おおいじゅん）
      ゆうせん② まだ やって いない かんじ
      ゆうせん③ ふつうの かんじ
      じょがい  3かい つづけて せいかい＝クリア（たりない ときだけ もどす）
   ============================================================ */
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]]; } return b; };

function buildSet(size = 10){
  const wrongPool = [], freshPool = [], normalPool = [], masteredPool = [];
  for(const q of QUESTIONS){
    const s = DB.stats[q.k];
    if(s && s.mastered)      masteredPool.push(q);
    else if(s && s.wrong > 0) wrongPool.push(q);
    else if(!s || s.seen === 0) freshPool.push(q);
    else                      normalPool.push(q);
  }
  wrongPool.sort((a,b) => (DB.stats[b.k].wrong - DB.stats[a.k].wrong) || (DB.stats[b.k].lastWrong - DB.stats[a.k].lastWrong));

  const picked = [];
  const take = arr => { for(const q of arr){ if(picked.length >= size) return; picked.push(q); } };
  take(wrongPool);                       // まちがえた かんじを さいゆうせん
  take(shuffle(freshPool));
  take(shuffle(normalPool));
  take(shuffle(masteredPool));           // それでも たりなければ クリアずみも もどす
  return shuffle(picked);
}

   ============================================================ */
let AC = null;
function ac(){
  if(!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
  }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function tone({ freq, start=0, dur=0.18, type="sine", vol=0.22, slideTo=null }){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + start;
  const osc = c.createOscillator();
  const g   = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(c.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}

function seFanfare(){
  const N = { C5:523.25, E5:659.25, G5:783.99, C6:1046.5, E6:1318.5, G6:1568 };
  const melody = [
    [N.C5, 0.00, 0.16], [N.E5, 0.14, 0.16], [N.G5, 0.28, 0.16],
    [N.C6, 0.42, 0.30], [N.G5, 0.74, 0.14], [N.C6, 0.86, 0.60]
  ];
  melody.forEach(([f, s, d]) => {
    tone({ freq: f, start: s, dur: d, type:"square",   vol:0.10 });
    tone({ freq: f, start: s, dur: d, type:"triangle", vol:0.20 });
  });
  // さいごの わおん
  [N.C6, N.E6, N.G6].forEach((f, i) =>
    tone({ freq: f, start: 0.86 + i*0.02, dur: 0.72, type:"sine", vol:0.13 }));
  // キラキラ
  for(let i=0;i<7;i++)
    tone({ freq: 1600 + i*260, start: 1.05 + i*0.055, dur: 0.16, type:"sine", vol:0.07 });
}

function renderStamps(el, noteEl, pressIndex = -1){
  const filled = DB.stamps % 5;
  const shown  = (filled === 0 && DB.stamps > 0 && pressIndex === 4) ? 5 : filled;
  el.innerHTML = "";
  for(let i=0;i<5;i++){
    const d = document.createElement("div");
    d.className = "slot";
    if(i < shown){
      d.classList.add("filled");
      const idx = (Math.floor((DB.stamps - 1 - (shown - 1 - i)) ) % STAMP_SVGS.length + STAMP_SVGS.length) % STAMP_SVGS.length;
      d.innerHTML = STAMP_SVGS[idx];
      if(i === pressIndex) d.classList.add("pressed");
    }
    el.appendChild(d);
  }
  if(noteEl){
    const left = 5 - shown;
    const u = unlockedCount();
    noteEl.innerHTML = (left === 0)
      ? `カードが いっぱい！ ごほうびカード <b>${u}</b> まい げっとちゅう`
      : `あと <b>${left}</b> こで ごほうびカードが 1まい もらえるよ（いま <b>${u}</b> まい）`;
  }
}

let SET = [], idx = 0, correctCount = 0, missed = [], locked = false;

function startQuiz(){
  SET = buildSet(10);
  idx = 0; correctCount = 0; missed = []; locked = false;
  show("s-quiz");
  renderQuestion();
}

function renderQuestion(){
  const q = SET[idx];
  $("#q-count").textContent = `${idx + 1} / ${SET.length}`;
  $("#q-bar").style.width = ((idx) / SET.length * 100) + "%";
  $("#q-hearts").textContent = "♥".repeat(Math.max(0, correctCount)).slice(0, 10);
  $("#q-hearts").style.color = "#FF9EC4";

  $("#q-sentence").innerHTML =
    q.pre +
    `<span class="blank" id="blank"><span class="yomi">${q.yomi}</span>?</span>` +
    q.post;

  const opts = shuffle([q.k, ...q.wrong]);
  const box = $("#q-choices");
  box.innerHTML = "";
  opts.forEach(ch => {
    const b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    b.textContent = ch;
    b.setAttribute("aria-label", ch);
    b.addEventListener("click", () => answer(b, ch, q));
    box.appendChild(b);
  });
  applyFurigana();
  locked = false;
}

function answer(btn, choice, q){
  if(locked) return;
  locked = true;
  const s = statOf(q.k);
  s.seen++;

  const blank = $("#blank");
  const ok = (choice === q.k);

  $$("#q-choices .choice").forEach(b => {
    b.disabled = true;
    if(b.textContent === q.k) b.classList.add("correct");
    else if(b === btn)        b.classList.add("wrong");
    else                      b.classList.add("dim");
  });

  blank.innerHTML = `<span class="yomi">${q.yomi}</span>${q.k}`;
  blank.classList.add(ok ? "done" : "miss");

  if(ok){
    correctCount++;
    s.streak++;
    if(s.streak >= 3) s.mastered = true;
    seCorrect();
    judge("せいかい！", "yes");
  }else{
    s.streak = 0;
    s.wrong++;
    s.mastered = false;
    s.lastWrong = Date.now();
    if(!missed.some(m => m.k === q.k)) missed.push(q);
    seWrong();
    judge("おしい！", "no");
  }
  save();

  setTimeout(() => {
    idx++;
    if(idx < SET.length) renderQuestion();
    else finish();
  }, ok ? 900 : 1500);
}

function judge(text, kind){
  const d = document.createElement("div");
  d.className = "judge " + kind;
  d.innerHTML = `<div class="bubble">${text}</div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 850);
}

                          "さいごまで がんばったね。つぎは もっと できるよ！";

  }else{
    pBox.innerHTML =

       </div>`;
  }

function renderReview(){
  const box = $("#rv-body");
  const entries = Object.entries(DB.stats);
  const weak     = entries.filter(([,s]) => s.wrong > 0 && !s.mastered)
                          .sort((a,b) => b[1].wrong - a[1].wrong);
  const mastered = entries.filter(([,s]) => s.mastered);

  // 拡大表示で「まえ／つぎ」に動く順番（画面に並んでいる順と同じ）
  chipOrder = [...weak.map(e => e[0]), ...mastered.map(e => e[0])];

  if(!entries.length){
    chipOrder = [];
    box.innerHTML = `<p style="text-align:center;font-weight:700;color:var(--ink-soft);margin:8px 0">
      まだ きろくが ないよ。<br>まずは クイズを 1かい やって みよう！</p>`;
    return;
  }
  const chip = (k, sub, kind) =>
    `<button class="kchip ${kind}" type="button" data-k="${k}" aria-label="${k} を おおきく みる">
       <span class="kchip-face">${k}</span>
       <span class="kchip-sub">${sub}</span>
     </button>`;

  box.innerHTML =
    `<h2 class="card-title"><span class="dot"></span>いま れんしゅうちゅう（${weak.length}）</h2>
     <p class="rv-hint">${weak.length || mastered.length ? "かんじを おすと おおきく みられるよ" : ""}</p>
     <div class="kchips">
       ${weak.length ? weak.map(([k,s]) => chip(k, `×${s.wrong}`, "weak")).join("")
                     : `<p style="font-weight:700;color:var(--ink-soft);margin:0">にがてな かんじは いま ないよ！</p>`}
     </div>
     <h2 class="card-title" style="margin-top:22px"><span class="dot" style="background:var(--mint);box-shadow:0 0 0 4px var(--mint-soft)"></span>クリア した かんじ（${mastered.length}）</h2>
     <div class="kchips">
       ${mastered.length ? mastered.map(([k]) => chip(k, "クリア！", "done")).join("")
                         : `<p style="font-weight:700;color:var(--ink-soft);margin:0">3かい つづけて せいかいすると ここに はいるよ</p>`}
     </div>`;
}

/* ---- かんじの 拡大表示（にがてな かんじ の いちらんから ひらく） ---- */
let chipOrder = [], zoomIndex = -1;

function openZoom(k){
  const i = chipOrder.indexOf(k);
  zoomIndex = (i === -1) ? -1 : i;
  const q = QUESTIONS.find(x => x.k === k);
  const s = DB.stats[k] || {};
  const done = !!s.mastered;
  const hasNav = chipOrder.length > 1 && zoomIndex !== -1;

  $("#zoom").innerHTML =
    `<div class="zoom-card">
       <button class="zoom-close" id="zoom-close" type="button" aria-label="とじる">✕</button>
       <div class="masu big ${done ? "done" : ""}"><span>${k}</span></div>
       <div class="zoom-meta">
         <span class="pr-yomi ${done ? "done" : ""}">よみ：${q ? q.yomi : "－"}</span>
         ${q ? `<p class="pr-ex">${q.pre}<b>${k}</b>${q.post}</p>` : ""}
         <p class="zoom-state">${done ? "3かい つづけて せいかい！ クリアずみ" : `まちがえた かいすう：${s.wrong || 0}かい`}</p>
       </div>
       ${hasNav ? `<div class="zoom-nav">
          <button class="btn ghost" id="zoom-prev" type="button">‹ まえ</button>
          <span class="zoom-count">${zoomIndex + 1} / ${chipOrder.length}</span>
          <button class="btn ghost" id="zoom-next" type="button">つぎ ›</button>
        </div>` : ""}
     </div>`;

  $("#zoom").classList.add("on");
  document.body.style.overflow = "hidden";
  $("#zoom-close").addEventListener("click", closeZoom);
  if(hasNav){
    $("#zoom-prev").addEventListener("click", () => { seTap(); step(-1); });
    $("#zoom-next").addEventListener("click", () => { seTap(); step(1); });
  }
  $("#zoom-close").focus();
}

function step(d){
  if(!chipOrder.length) return;
  zoomIndex = (zoomIndex + d + chipOrder.length) % chipOrder.length;
  openZoom(chipOrder[zoomIndex]);
}

function closeZoom(){
  $("#zoom").classList.remove("on");
  $("#zoom").innerHTML = "";
  document.body.style.overflow = "";
  zoomIndex = -1;
}


/* ふりがなの表示切り替え（よめるように なったら けして よむ れんしゅう） */
function applyFurigana(){
  const on = DB.furigana !== false;
  const sent = $("#q-sentence");
  if(sent) sent.classList.toggle("no-furigana", !on);
  const b = $("#btn-ruby");
  if(b){
    b.textContent = on ? "ふりがな：あり" : "ふりがな：なし";
    b.classList.toggle("off", !on);
    b.setAttribute("aria-pressed", String(!on));
  }
}

   12. ボタン
   ============================================================ */
$("#btn-start").addEventListener("click", () => { seTap(); startQuiz(); });
$("#btn-again").addEventListener("click", () => { seTap(); startQuiz(); });
$("#btn-quit").addEventListener("click",  () => { seTap(); goHome(); });
$("#btn-ruby").addEventListener("click",  () => { seTap(); DB.furigana = (DB.furigana === false); save(); applyFurigana(); });
$("#btn-home").addEventListener("click",  () => { seTap(); goHome(); });
$("#btn-gallery").addEventListener("click", () => { seTap(); renderGallery(); show("s-gallery"); });
$("#btn-gallery-back").addEventListener("click", () => { seTap(); goHome(); });
$("#btn-review").addEventListener("click", () => { seTap(); renderReview(); show("s-review"); });
$("#btn-review-back").addEventListener("click", () => { seTap(); goHome(); });

/* かんじを おすと おおきく みえる */
$("#rv-body").addEventListener("click", e => {
  const chip = e.target.closest(".kchip");
  if(!chip) return;
  seTap();
  openZoom(chip.dataset.k);
});
/* はいけいを おすと とじる */
$("#zoom").addEventListener("click", e => { if(e.target === $("#zoom")) closeZoom(); });
/* キーボードでも つかえるように */
document.addEventListener("keydown", e => {
  if(!$("#zoom").classList.contains("on")) return;
  if(e.key === "Escape")     { closeZoom(); }
  if(e.key === "ArrowLeft")  { step(-1); }
  if(e.key === "ArrowRight") { step(1); }
});

function goHome(){
  renderStamps($("#home-stamps"), $("#home-stamp-note"));
  show("s-home");
}

/* さいしょの びょうが */
renderStamps($("#home-stamps"), $("#home-stamp-note"));
applyFurigana();
</script>
