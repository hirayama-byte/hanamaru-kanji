<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@400;600&display=swap">

<style>
/* ============================================================
   はなまるかんじ
   単一テーマ（ふんわりパステルの世界）を意図的に採用。
   ダーク環境でも同じ世界観を保つため、色は全てトークンで明示。
   ============================================================ */
:root{
  color-scheme: light;

  --milk:      #FFF7FB;
  --milk-deep: #FFEDF5;
  --card:      #FFFFFF;

  --pink:      #FF9EC4;
  --pink-deep: #E8619A;
  --pink-soft: #FFDCEB;

  --mint:      #7FD9C0;
  --mint-deep: #3FAE93;
  --mint-soft: #DAF6EE;

  --yellow:      #FFD66B;
  --yellow-deep: #E0A82E;
  --yellow-soft: #FFF3D4;

  --lav:      #B79BEF;
  --lav-deep: #8360D6;
  --lav-soft: #EEE6FF;

  /* ニュートラルはピンク寄りに振ったすもも色。純グレーは使わない */
  --ink:       #6A4658;
  --ink-soft:  #9C7B8B;
  --line:      #F3DCE7;

  --r-lg: 28px;
  --r-md: 20px;
  --r-sm: 14px;

  --f-display: 'Yusei Magic', 'Zen Maru Gothic', system-ui, sans-serif;
  --f-body: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
  --f-kanji: 'Klee One', 'Zen Maru Gothic', serif;
}
:root[data-theme="dark"]{ color-scheme: light; }

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--milk);
  background-image:
    radial-gradient(120% 80% at 10% 0%,  var(--pink-soft) 0%, transparent 55%),
    radial-gradient(110% 70% at 95% 8%,  var(--mint-soft) 0%, transparent 50%),
    radial-gradient(120% 90% at 50% 105%, var(--yellow-soft) 0%, transparent 55%);
  background-attachment: fixed;
  font-family: var(--f-body);
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

/* ---------- きらきら背景 ---------- */
#sparkles{
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0;
  overflow: hidden;
}
.sp{
  position: absolute;
  font-size: 18px;
  opacity: 0;
  animation: twinkle 5s ease-in-out infinite;
  will-change: transform, opacity;
}
@keyframes twinkle{
  0%   { opacity: 0;   transform: translateY(6px) scale(.5) rotate(0deg); }
  35%  { opacity: .85; transform: translateY(-4px) scale(1) rotate(12deg); }
  70%  { opacity: .35; transform: translateY(-14px) scale(.9) rotate(-8deg); }
  100% { opacity: 0;   transform: translateY(-24px) scale(.5) rotate(0deg); }
}

/* ---------- 画面のわく ---------- */
.stage{
  position: relative; z-index: 1;
  width: 100%; max-width: 500px;
  margin: 0 auto;
  min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(40px, calc(env(safe-area-inset-bottom) + 24px)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 18px;
}
/* 小さめの端末（iPhone SE など）向けの微調整 */
@media (max-width: 380px){
  .stage{ gap: 14px; }
  .card{ padding: 16px 14px; }
  .btn{ padding: 15px 16px; font-size: 1rem; }
  .choice{ padding: 16px 6px 18px; }
}

@media (min-width: 800px){
  .stage{
    margin: 24px auto;
    min-height: auto;
    background: rgba(255,255,255,.55);
    border: 3px solid var(--card);
    border-radius: 40px;
    box-shadow: 0 24px 60px rgba(232,97,154,.16);
    padding: 24px 20px 36px;
  }
}

.screen{ display: none; flex-direction: column; gap: 18px; }
.screen.on{ display: flex; animation: popin .38s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes popin{
  from{ opacity: 0; transform: translateY(14px) scale(.96); }
  to  { opacity: 1; transform: none; }
}

/* ---------- ロゴ ---------- */
.logo{ text-align: center; padding-top: 8px; }
.logo h1{
  font-family: var(--f-display);
  font-size: clamp(2.1rem, 11vw, 2.9rem);
  margin: 0;
  line-height: 1.15;
  text-wrap: balance;
  color: var(--pink-deep);
  text-shadow:
     3px 3px 0 var(--card),
    -2px -2px 0 var(--card),
     0 7px 0 var(--pink-soft);
  letter-spacing: .02em;
}
.logo .sub{
  margin: 12px 0 0;
  font-size: .82rem;
  font-weight: 700;
  color: var(--ink-soft);
  letter-spacing: .12em;
}
.logo .grade-badge{
  display: inline-block;
  margin-top: 12px;
  background: var(--mint);
  color: #fff;
  font-weight: 900;
  font-size: .78rem;
  padding: 7px 16px;
  border-radius: 999px;
  box-shadow: 0 4px 0 var(--mint-deep);
  letter-spacing: .06em;
}

/* ---------- カード ---------- */
.card{
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 20px 18px;
  box-shadow: 0 8px 0 var(--line), 0 16px 30px rgba(232,97,154,.12);
}
.card-title{
  margin: 0 0 14px;
  font-size: .95rem;
  font-weight: 900;
  color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.card-title .dot{
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--pink); flex: none;
  box-shadow: 0 0 0 4px var(--pink-soft);
}

/* ---------- ぷっくりボタン ---------- */
.btn{
  font-family: var(--f-body);
  font-weight: 900;
  border: none;
  border-radius: var(--r-md);
  padding: 17px 20px;
  font-size: 1.05rem;
  color: #fff;
  background: var(--pink);
  box-shadow: 0 6px 0 var(--pink-deep), 0 12px 20px rgba(232,97,154,.28);
  cursor: pointer;
  transition: transform .12s cubic-bezier(.2,1.6,.4,1), box-shadow .12s ease, filter .12s ease;
  width: 100%;
  letter-spacing: .04em;
}
@media (hover: hover) and (pointer: fine){
  .btn:hover{ transform: translateY(-3px) scale(1.02); filter: brightness(1.04); }
}
.btn:active{ transform: translateY(4px) scale(.98); box-shadow: 0 2px 0 var(--pink-deep); }
.btn:focus-visible{ outline: 4px solid var(--lav); outline-offset: 3px; }
.btn.mint{ background: var(--mint); box-shadow: 0 6px 0 var(--mint-deep), 0 12px 20px rgba(63,174,147,.26); }
.btn.mint:active{ box-shadow: 0 2px 0 var(--mint-deep); }
.btn.lav{ background: var(--lav); box-shadow: 0 6px 0 var(--lav-deep), 0 12px 20px rgba(131,96,214,.24); }
.btn.lav:active{ box-shadow: 0 2px 0 var(--lav-deep); }
.btn.ghost{
  background: var(--card); color: var(--ink-soft);
  box-shadow: 0 5px 0 var(--line); font-size: .92rem; padding: 14px;
}
.btn.ghost:active{ box-shadow: 0 2px 0 var(--line); }
.btn-row{ display: flex; gap: 10px; }
.btn-row .btn{ flex: 1; }

/* ---------- スタンプカード ---------- */
.stamps{
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}
.slot{
  aspect-ratio: 1;
  border-radius: 50%;
  border: 3px dashed var(--line);
  display: grid; place-items: center;
  background: var(--milk);
  position: relative;
}
.slot svg{ width: 78%; height: 78%; }
.slot.filled{ border: 3px solid transparent; background: var(--pink-soft); }
.slot.pressed{ animation: stamp-press .6s cubic-bezier(.2,1.7,.4,1) both; }
@keyframes stamp-press{
  0%  { transform: scale(2.6) rotate(-22deg); opacity: 0; }
  55% { transform: scale(.86) rotate(6deg);  opacity: 1; }
  100%{ transform: none; opacity: 1; }
}
.stamp-note{
  margin: 12px 0 0; font-size: .78rem; color: var(--ink-soft);
  font-weight: 700; text-align: center;
}
.stamp-note b{ color: var(--pink-deep); font-size: 1rem; }

/* ---------- クイズ ---------- */
.quiz-top{ display: flex; align-items: center; gap: 12px; }
.q-count{
  font-family: var(--f-display);
  font-size: 1.05rem; color: var(--pink-deep); flex: none;
  font-variant-numeric: tabular-nums;
}
.bar{
  flex: 1; height: 14px; border-radius: 999px;
  background: var(--card); box-shadow: inset 0 2px 4px rgba(232,97,154,.14);
  overflow: hidden;
}
.bar > i{
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--yellow), var(--pink));
  border-radius: 999px;
  transition: width .45s cubic-bezier(.3,1.4,.4,1);
}
.hearts{ flex: none; font-size: .95rem; letter-spacing: 1px; }

.q-card{
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 26px 20px 28px;
  box-shadow: 0 8px 0 var(--line), 0 18px 34px rgba(232,97,154,.13);
  text-align: center;
}
.q-label{
  display: inline-block; background: var(--yellow-soft); color: var(--yellow-deep);
  font-size: .72rem; font-weight: 900; padding: 5px 14px; border-radius: 999px;
  letter-spacing: .1em; margin-bottom: 18px;
}
.q-sentence{
  font-size: clamp(1.25rem, 5.6vw, 1.6rem);
  /* よみがなは 行の 中に 入るので、行間を むりに ひろげる ひつようは ない */
  font-weight: 700; line-height: 2.3; margin: 0;
  text-wrap: balance;
}
.q-sentence ruby rt{ font-size: .62em; font-weight: 700; color: var(--ink-soft); }

.q-sentence ruby{ ruby-position: over; }
.q-sentence.no-furigana rt{ visibility: hidden; }
.pr-ex ruby rt{ font-size: .72em; font-weight: 700; color: var(--ink-soft); }

/* ふりがなの表示切り替え */
.ruby-toggle{
  align-self: center;
  font-family: var(--f-body); font-weight: 900; font-size: .76rem;
  color: var(--mint-deep); background: var(--mint-soft);
  border: none; border-radius: 999px; padding: 8px 18px;
  box-shadow: 0 3px 0 rgba(63,174,147,.28);
  cursor: pointer; letter-spacing: .06em;
  transition: transform .12s cubic-bezier(.2,1.6,.4,1);
}
@media (hover: hover) and (pointer: fine){
  .ruby-toggle:hover{ transform: translateY(-2px); }
}
.ruby-toggle:active{ transform: translateY(2px); box-shadow: 0 1px 0 rgba(63,174,147,.28); }
.ruby-toggle:focus-visible{ outline: 3px solid var(--lav); outline-offset: 3px; }
.ruby-toggle.off{ color: var(--ink-soft); background: var(--line); box-shadow: 0 3px 0 rgba(232,97,154,.18); }

.blank{
  display: inline-grid; place-items: center;
  width: 2.1em; height: 2.1em;
  /* 文の line-height を つぐと ？の 行ボックスが わくより 高くなり
     天地中央に ならない。1 に して わくの まんなかに おく */
  line-height: 1;
  margin: 0 .12em;
  border-radius: 16px;
  background: var(--pink-soft);
  border: 3px dashed var(--pink);
  font-family: var(--f-kanji); font-weight: 600;
  color: var(--pink-deep);
  position: relative;
  animation: blank-pulse 1.6s ease-in-out infinite;
}
@keyframes blank-pulse{
  0%,100%{ transform: scale(1); }
  50%    { transform: scale(1.06); }
}
/* よみがな＋わく を たてに ならべた ひとかたまり。
   position:absolute で うかせると 行の たかさに かぞえられず 上の行に かぶるので、
   flex の 列に して 行の 中に 実体として おく（行が じどうで 高くなる） */
.blankwrap{
  display: inline-flex; flex-direction: column; align-items: center;
  gap: 7px; vertical-align: middle; margin: 0 .18em;
}
.brow{ display: inline-flex; gap: .12em; }
.blankwrap .yomi{
  font-family: var(--f-body); font-weight: 900; line-height: 1.2;
  font-size: .62em; white-space: nowrap; color: var(--mint-deep);
  background: var(--mint-soft); padding: 4px 13px; border-radius: 999px;
  box-shadow: 0 2px 0 rgba(63,174,147,.18);
}
.blank.done{
  background: var(--mint-soft); border: 3px solid var(--mint); color: var(--mint-deep);
  animation: none;
}
.blank.miss{
  background: var(--lav-soft); border: 3px solid var(--lav); color: var(--lav-deep);
  animation: none;
}

.choices{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice{
  font-family: var(--f-kanji);
  font-weight: 600;
  font-size: clamp(2.4rem, 13vw, 3.2rem);
  line-height: 1;
  padding: 20px 8px 22px;
  border: none;
  border-radius: var(--r-md);
  background: var(--card);
  color: var(--ink);
  box-shadow: 0 6px 0 var(--line), 0 12px 20px rgba(232,97,154,.10);
  cursor: pointer;
  transition: transform .14s cubic-bezier(.2,1.7,.4,1), box-shadow .14s ease, background .2s ease;
}
/* マウスのある端末だけ。スマホは直前にタップした位置に hover が残り、
   次の問題でその位置の選択肢が最初から色づいて見えてしまうため */
@media (hover: hover) and (pointer: fine){
  .choice:hover:not(:disabled){ transform: translateY(-4px) scale(1.03); }
}
.choice:active:not(:disabled){ transform: translateY(3px) scale(.97); box-shadow: 0 2px 0 var(--line); }
.choice:focus-visible{ outline: 4px solid var(--lav); outline-offset: 3px; }
.choice:disabled{ cursor: default; }
.choice.correct{
  background: var(--mint); color: #fff;
  box-shadow: 0 6px 0 var(--mint-deep);
  animation: bounce-yes .55s cubic-bezier(.2,1.7,.4,1) both;
}
@keyframes bounce-yes{
  0%{ transform: scale(1); } 40%{ transform: scale(1.16) rotate(-4deg); } 100%{ transform: scale(1.05); }
}
.choice.wrong{
  background: var(--lav-soft); color: var(--lav-deep);
  box-shadow: 0 6px 0 var(--lav);
  animation: shake .42s ease both;
}
@keyframes shake{
  0%,100%{ transform: translateX(0); }
  20%{ transform: translateX(-8px) rotate(-3deg); }
  45%{ transform: translateX(7px) rotate(3deg); }
  70%{ transform: translateX(-4px); }
}
.choice.dim{ opacity: .42; }

/* ---------- 正解・不正解のふきだし ---------- */
.judge{
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  pointer-events: none;
}
.judge .bubble{
  font-family: var(--f-display);
  font-size: clamp(2.4rem, 14vw, 3.6rem);
  padding: 26px 40px;
  border-radius: 40px;
  background: var(--card);
  box-shadow: 0 14px 0 var(--line), 0 26px 50px rgba(232,97,154,.28);
  animation: judge-pop .8s cubic-bezier(.2,1.6,.4,1) both;
}
.judge.yes .bubble{ color: var(--mint-deep); }
.judge.no  .bubble{ color: var(--lav-deep); }
@keyframes judge-pop{
  0%  { transform: scale(.3) rotate(-14deg); opacity: 0; }
  35% { transform: scale(1.12) rotate(4deg); opacity: 1; }
  60% { transform: scale(1) rotate(0); opacity: 1; }

}

/* ---------- けっか（はなまる） ---------- */

}
@keyframes maru-draw{
  0%  { transform: scale(.2) rotate(-90deg); opacity: 0; }

}

<script>
/* ============================================================
   1. もんだいデータ（ふやすときは この はいれつに たすだけ）
      k    : こたえの かんじ
      yomi : そらんに はいる よみ（ふりがな）
      pre  : ぶんの まえ半分 / post : うしろ半分（HTMLタグ可・rubyでふりがな）
      wrong: まちがえやすい 3つ（形・意味が にている かんじ）
      grade: 学年
   ============================================================ */
const QUESTIONS = [
  { k:"右", yomi:"みぎ", grade:1, pre:"<ruby>次<rt>つぎ</rt></ruby>の <ruby>角<rt>かど</rt></ruby>を ", post:" に <ruby>曲<rt>ま</rt></ruby>がる。", wrong:["左","石","名"] },
  { k:"左", yomi:"ひだり", grade:1, pre:"", post:" の <ruby>手<rt>て</rt></ruby>を <ruby>上<rt>あ</rt></ruby>げる。", wrong:["右","友","石"] },
  { k:"大", yomi:"おお", grade:1, pre:"とても ", post:"きな <ruby>声<rt>こえ</rt></ruby>で <ruby>歌<rt>うた</rt></ruby>う。", wrong:["犬","太","天"] },
  { k:"犬", yomi:"いぬ", grade:1, pre:"<ruby>白<rt>しろ</rt></ruby>い ", post:" と いっしょに <ruby>歩<rt>ある</rt></ruby>く。", wrong:["大","太","天"] },
  { k:"太", yomi:"ふと", grade:2, pre:"", post:"い えんぴつで <ruby>字<rt>じ</rt></ruby>を <ruby>書<rt>か</rt></ruby>く。", wrong:["大","犬","木"] },
  { k:"天", yomi:"てん", grade:1, pre:"<ruby>明日<rt>あした</rt></ruby>は いい ", post:"<ruby>気<rt>き</rt></ruby>に なりそう。", wrong:["大","犬","矢"] },
  { k:"日", yomi:"ひ", grade:1, pre:"<ruby>朝<rt>あさ</rt></ruby>、", post:" が のぼって くる。", wrong:["目","白","月"] },
  { k:"目", yomi:"め", grade:1, pre:"<ruby>音楽<rt>おんがく</rt></ruby>を きくとき そっと ", post:" を とじる。", wrong:["日","貝","耳"] },
  { k:"月", yomi:"つき", grade:1, pre:"<ruby>夜<rt>よる</rt></ruby>の ", post:" が とても きれい。", wrong:["日","用","目"] },

const KEY = "hanamaru-kanji-v1";
const blankSave = () => ({ stats:{}, wstats:{}, stamps:0, clears:0, furigana:true, grade:"all" });

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return blankSave();
    return Object.assign(blankSave(), JSON.parse(raw));
  }catch(e){ return blankSave(); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
}
let DB = load();

function statOf(k){
  if(!DB.stats[k]) DB.stats[k] = { streak:0, wrong:0, seen:0, mastered:false, lastWrong:0 };
  return DB.stats[k];
}
function wstatOf(w){
  if(!DB.wstats[w]) DB.wstats[w] = { streak:0, wrong:0, seen:0, mastered:false, lastWrong:0 };
  return DB.wstats[w];
}
const unlockedCount = () => Math.min(REWARDS.length, Math.floor(DB.stamps / 5));

/* ============================================================
   3. しゅつだい アルゴリズム
      ゆうせん① まちがえた かんじ（まちがえた かいすう が おおいじゅん）
      ゆうせん② まだ やって いない かんじ
      ゆうせん③ ふつうの かんじ
      じょがい  3かい つづけて せいかい＝クリア（たりない ときだけ もどす）
   ============================================================ */
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]]; } return b; };

const REVIEW_MAX = 4;   // 1セット10問のうち「まちがえた もんだい」を入れる上限

function pickSet(list, stats, keyOf, size){
  const wrongPool = [], freshPool = [], normalPool = [], masteredPool = [];
  for(const q of list){
    const s = stats[keyOf(q)];
    if(s && s.mastered)         masteredPool.push(q);
    else if(s && s.wrong > 0)   wrongPool.push(q);
    else if(!s || s.seen === 0) freshPool.push(q);
    else                        normalPool.push(q);
  }
  wrongPool.sort((a,b) => (stats[keyOf(b)].wrong - stats[keyOf(a)].wrong)
                       || (stats[keyOf(b)].lastWrong - stats[keyOf(a)].lastWrong));
  const picked = [];
  const take = (arr, max) => {
    for(const q of arr){
      if(picked.length >= size) return;
      if(max !== undefined && picked.length >= max) return;
      picked.push(q);
    }
  };
  // まちがえた もんだいは 10問のうち 4問までにして、のこりは たくさんの中から ランダムに出す
  take(wrongPool, Math.min(size, REVIEW_MAX));
  take(shuffle(freshPool));
  take(shuffle(normalPool));
  take(wrongPool);                       // それでも たりなければ 復習を さらに入れる
  take(shuffle(masteredPool));           // それでも たりなければ クリアずみも もどす
  return shuffle(picked);
}

function buildSet(size = 10){
  if(LEVEL === 3) return pickSet(TEST, DB.wstats, q => q.w, size);   // テストは はんいに かんけいなく 10問ぜんぶ
  return LEVEL === 1
    ? pickSet(QUESTIONS.filter(inRange), DB.stats,  q => q.k, size)
    : pickSet(JUKUGO.filter(inRange),    DB.wstats, q => q.w, size);
}

   ============================================================ */
let AC = null;
function ac(){
  if(!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = new C();
  }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function tone({ freq, start=0, dur=0.18, type="sine", vol=0.22, slideTo=null }){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + start;
  const osc = c.createOscillator();
  const g   = c.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(c.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
/* 正解：たかめの ピンポン♪ */
function seCorrect(){

  tone({ freq: 987.77, dur: 0.14, type:"triangle", vol:0.10 });
  tone({ freq: 1318.51, start: 0.13, dur: 0.34, type:"sine",     vol:0.24 }); // E6
  tone({ freq: 1318.51, start: 0.13, dur: 0.34, type:"triangle", vol:0.09 });
}

}

/* クリア：ジャジャーン！ ファンファーレ */
function seFanfare(){
  const N = { C5:523.25, E5:659.25, G5:783.99, C6:1046.5, E6:1318.5, G6:1568 };
  const melody = [
    [N.C5, 0.00, 0.16], [N.E5, 0.14, 0.16], [N.G5, 0.28, 0.16],
    [N.C6, 0.42, 0.30], [N.G5, 0.74, 0.14], [N.C6, 0.86, 0.60]
  ];
  melody.forEach(([f, s, d]) => {
    tone({ freq: f, start: s, dur: d, type:"square",   vol:0.10 });
    tone({ freq: f, start: s, dur: d, type:"triangle", vol:0.20 });
  });
  // さいごの わおん
  [N.C6, N.E6, N.G6].forEach((f, i) =>
    tone({ freq: f, start: 0.86 + i*0.02, dur: 0.72, type:"sine", vol:0.13 }));
  // キラキラ
  for(let i=0;i<7;i++)
    tone({ freq: 1600 + i*260, start: 1.05 + i*0.055, dur: 0.16, type:"sine", vol:0.07 });
}

let SET = [], idx = 0, correctCount = 0, missed = [], locked = false;
let LEVEL = 1, subIdx = 0, subResult = [null, null];

function startQuiz(level){
  if(level) LEVEL = level;
  SET = buildSet(10);
  idx = 0; correctCount = 0; missed = []; locked = false;
  show("s-quiz");
  renderQuestion();
}

function renderQuestion(){
  const q = SET[idx];
  $("#q-count").textContent = `${LEVEL === 3 ? "テスト" : "Lv." + LEVEL}　${idx + 1} / ${SET.length}`;
  $("#q-bar").style.width = ((idx) / SET.length * 100) + "%";
  $("#q-hearts").textContent = "♥".repeat(Math.max(0, correctCount)).slice(0, 10);
  $("#q-hearts").style.color = "#FF9EC4";

  if(LEVEL === 1){
    $("#q-label").textContent = "□に はいる かんじは？";
    $("#q-sentence").innerHTML =
      q.pre +
      `<span class="blankwrap"><span class="yomi">${q.yomi}</span>` +
      `<span class="brow"><span class="blank" id="blank">?</span></span></span>` +
      q.post;
    renderChoices(q.k, [q.k, ...q.wrong], q);
  }else{
    const n = q.w.length;
    subIdx = 0; subResult = new Array(n).fill(null);
    $("#q-sentence").innerHTML =
      q.pre +
      `<span class="blankwrap"><span class="yomi">${q.yomi}</span><span class="brow">` +
      Array.from({ length: n }, (_, i) => `<span class="blank" id="b${i}">?</span>`).join("") +
      `</span></span>` +
      q.post;
    renderSub(q);
  }
  applyFurigana();
  locked = false;
}

/* レベル2: いま きいている ほうの マスを ひからせる */
function renderSub(q){
  const n = q.w.length;
  $("#q-label").textContent =
    n === 1        ? "□に はいる かんじは？" :
    subIdx === 0   ? "1つめの かんじは？" : "2つめの かんじは？";
  for(let i = 0; i < n; i++){
    const el = $("#b" + i);
    if(subResult[i] === null) el.classList.toggle("waiting", subIdx !== i);
    else                      el.classList.remove("waiting");
  }
  const target = q.w[subIdx];
  renderChoices(target, [target, ...(subIdx === 0 ? q.wrong1 : q.wrong2)], q);
}

function renderChoices(target, opts, q){
  const box = $("#q-choices");
  box.innerHTML = "";
  shuffle(opts).forEach(ch => {
    const b = document.createElement("button");
    b.className = "choice";
    b.type = "button";
    b.textContent = ch;
    b.setAttribute("aria-label", ch);
    b.addEventListener("click", () => answer(b, ch, q, target));
    box.appendChild(b);
  });
  locked = false;
}

function markChoices(target, btn){
  $$("#q-choices .choice").forEach(b => {
    b.disabled = true;
    if(b.textContent === target) b.classList.add("correct");
    else if(b === btn)           b.classList.add("wrong");
    else                         b.classList.add("dim");
  });
}

/* 1もじぶんの せいかい・ふせいかいを きろくする */
function recordChar(k, ok, example){
  const s = statOf(k);
  s.seen++;
  if(ok){
    s.streak++;
    if(s.streak >= 3) s.mastered = true;
  }else{
    s.streak = 0;
    s.wrong++;
    s.mastered = false;
    s.lastWrong = Date.now();
    if(!missed.some(m => m.k === k)) missed.push(example);
  }
}

function answer(btn, choice, q, target){
  if(locked) return;
  locked = true;
  const ok = (choice === target);
  markChoices(target, btn);

  if(LEVEL === 1){
    recordChar(q.k, ok, q);
    const blank = $("#blank");
    blank.textContent = q.k;   // よみがなは わくの そと（.blankwrap）に あるので さわらない
    blank.classList.add(ok ? "done" : "miss");
    if(ok) correctCount++;
    ok ? seCorrect() : seWrong();
    judge(ok ? "せいかい！" : "おしい！", ok ? "yes" : "no");
    save();
    setTimeout(() => {
      idx++;
      if(idx < SET.length) renderQuestion(); else finish();
    }, ok ? 900 : 1500);
    return;
  }

  /* ---- レベル2 ---- */
  recordChar(target, ok, { k: target, yomi: q.yomi, pre: q.pre, post: q.post, word: q.w });
  const el = $("#b" + subIdx);
  el.classList.remove("waiting");
  el.textContent = target;
  el.classList.add(ok ? "done" : "miss");
  subResult[subIdx] = ok;
  ok ? seCorrect() : seWrong();
  save();

  if(subIdx < q.w.length - 1){
    setTimeout(() => { subIdx++; renderSub(q); }, ok ? 800 : 1300);
    return;
  }

  const both = subResult.every(Boolean);
  const ws = wstatOf(q.w);
  ws.seen++;
  if(both){
    correctCount++;
    ws.streak++;
    if(ws.streak >= 3) ws.mastered = true;
  }else{
    ws.streak = 0;
    ws.wrong++;
    ws.mastered = false;
    ws.lastWrong = Date.now();
  }
  save();
  judge(both ? "せいかい！" : "おしい！", both ? "yes" : "no");
  setTimeout(() => {
    idx++;
    if(idx < SET.length) renderQuestion(); else finish();
  }, both ? 1000 : 1600);
}

function judge(text, kind){
  const d = document.createElement("div");
  d.className = "judge " + kind;
  d.innerHTML = `<div class="bubble">${text}</div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 850);
}

/* れいぶんの HTML を つくる（じゅくごなら その1文字だけ いろを つける） */
function exampleHTML(e, color){
  if(e.word){
    const body = e.word.split("").map(c =>
      c === e.k ? `<b style="color:${color}">${c}</b>` : c).join("");
    return e.pre + body + e.post;
  }
  return `${e.pre}<b style="color:${color}">${e.k}</b>${e.post}`;
}
function yomiLabel(e){
  return e.word ? `じゅくご：${e.word}（${e.yomi}）` : `よみ：${e.yomi}`;
}
/* にがてな かんじ の 拡大表示で つかう れい */
function exampleFor(k){
  const q = QUESTIONS.find(x => x.k === k);
  if(q) return { k, yomi: q.yomi, pre: q.pre, post: q.post };
  const j = JUKUGO.find(x => x.w.indexOf(k) !== -1);
  if(j) return { k, yomi: j.yomi, pre: j.pre, post: j.post, word: j.w };
  return null;
}

function finish(){
  $("#q-bar").style.width = "100%";

  const before = unlockedCount();

  const after = unlockedCount();

  $("#r-msg").textContent =
    correctCount === 10 ? "パーフェクト！ かんぺきだよ、すごい！" :
    correctCount >= 8   ? "とっても よく できました！" :
    correctCount >= 5   ? "はんぶん いじょう せいかい！ その ちょうし！" :
                          "さいごまで がんばったね。つぎは もっと できるよ！";

  const pressAt = ((DB.stamps - 1) % 5);
  renderStamps($("#r-stamps"), $("#r-stamp-note"), pressAt);

  // ごほうび かいほう
  const uBox = $("#r-unlock");
  uBox.innerHTML = "";

    uBox.innerHTML =

    pBox.innerHTML =
      `<div class="card">
         <p class="practice-lead">てもとで かいて みよう！</p>

         ${missed.map(q => `
           <div class="pr-item">
             <div class="masu"><span>${q.k}</span></div>
             <div class="pr-meta">
               <span class="pr-yomi">${yomiLabel(q)}</span>
               <p class="pr-ex">${exampleHTML(q, "var(--pink-deep)")}</p>
             </div>
           </div>`).join("")}
       </div>`;
  }else{
    pBox.innerHTML =
      `<div class="card" style="text-align:center">
         <p class="practice-lead">ぜんもん せいかい！</p>
         <p class="practice-sub" style="margin:0">かきとりの れんしゅうは おやすみ。とっても えらい！</p>

/* ---- かんじの 拡大表示（にがてな かんじ の いちらんから ひらく） ---- */
let chipOrder = [], zoomIndex = -1;

function openZoom(k){
  const i = chipOrder.indexOf(k);
  zoomIndex = (i === -1) ? -1 : i;
  const q = exampleFor(k);
  const s = DB.stats[k] || {};
  const done = !!s.mastered;
  const hasNav = chipOrder.length > 1 && zoomIndex !== -1;

  $("#zoom").innerHTML =
    `<div class="zoom-card">
       <button class="zoom-close" id="zoom-close" type="button" aria-label="とじる">✕</button>
       <div class="masu big ${done ? "done" : ""}"><span>${k}</span></div>
       <div class="zoom-meta">
         <span class="pr-yomi ${done ? "done" : ""}">${q ? yomiLabel(q) : "よみ：－"}</span>
         ${q ? `<p class="pr-ex">${exampleHTML(q, done ? "var(--mint-deep)" : "var(--pink-deep)")}</p>` : ""}
         <p class="zoom-state">${done ? "3かい つづけて せいかい！ クリアずみ" : `まちがえた かいすう：${s.wrong || 0}かい`}</p>
       </div>
       ${hasNav ? `<div class="zoom-nav">
          <button class="btn ghost" id="zoom-prev" type="button">‹ まえ</button>
          <span class="zoom-count">${zoomIndex + 1} / ${chipOrder.length}</span>
          <button class="btn ghost" id="zoom-next" type="button">つぎ ›</button>
        </div>` : ""}
     </div>`;

  $("#zoom").classList.add("on");
  document.body.style.overflow = "hidden";
  $("#zoom-close").addEventListener("click", closeZoom);
  if(hasNav){
    $("#zoom-prev").addEventListener("click", () => { seTap(); step(-1); });
    $("#zoom-next").addEventListener("click", () => { seTap(); step(1); });
  }
  $("#zoom-close").focus();
}

function step(d){
  if(!chipOrder.length) return;
  zoomIndex = (zoomIndex + d + chipOrder.length) % chipOrder.length;
  openZoom(chipOrder[zoomIndex]);
}

function closeZoom(){
  $("#zoom").classList.remove("on");
  $("#zoom").innerHTML = "";
  document.body.style.overflow = "";
  zoomIndex = -1;
}


/* えらんだ はんい（学年）で もんだいを しぼる */
const inRange = q => (DB.grade || "all") === "all" || q.grade === Number(DB.grade);

function applyRange(){
  const g = String(DB.grade || "all");
  $$("#range-pills .range-pill").forEach(b => b.classList.toggle("on", b.dataset.g === g));
  const n1 = QUESTIONS.filter(inRange).length;
  const n2 = JUKUGO.filter(inRange).length;
  $("#range-note").innerHTML = `レベル1 <b>${n1}</b>もん ／ レベル2 <b>${n2}</b>もん<br><span style="font-size:.92em">テストべんきょうは はんいに かんけいなく ぜんぶで <b>${TEST.length}</b>もん（1かいに 10もん）</span>`;
}

/* ふりがなの表示切り替え（よめるように なったら けして よむ れんしゅう） */
function applyFurigana(){
  const on = DB.furigana !== false;
  const sent = $("#q-sentence");
  if(sent) sent.classList.toggle("no-furigana", !on);
  const b = $("#btn-ruby");
  if(b){
    b.textContent = on ? "ふりがな：あり" : "ふりがな：なし";
    b.classList.toggle("off", !on);
    b.setAttribute("aria-pressed", String(!on));
  }
}

  const b = e.target.closest(".range-pill");
  if(!b) return;
  seTap();
  DB.grade = b.dataset.g;
  save();
  applyRange();
});
$("#btn-ruby").addEventListener("click",  () => { seTap(); DB.furigana = (DB.furigana === false); save(); applyFurigana(); });

/* かんじを おすと おおきく みえる */
$("#rv-body").addEventListener("click", e => {
  const chip = e.target.closest(".kchip");
  if(!chip) return;
  seTap();
  openZoom(chip.dataset.k);
});
/* はいけいを おすと とじる */
$("#zoom").addEventListener("click", e => { if(e.target === $("#zoom")) closeZoom(); });
/* キーボードでも つかえるように */
document.addEventListener("keydown", e => {
  if(!$("#zoom").classList.contains("on")) return;
  if(e.key === "Escape")     { closeZoom(); }
  if(e.key === "ArrowLeft")  { step(-1); }
  if(e.key === "ArrowRight") { step(1); }
});

function goHome(){
  renderStamps($("#home-stamps"), $("#home-stamp-note"));
  show("s-home");
}

/* さいしょの びょうが */
renderStamps($("#home-stamps"), $("#home-stamp-note"));
applyRange();
applyFurigana();
</script>
